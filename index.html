<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE X-TREME | PREMIUM EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;600&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --dark-surface: #0a0a0f;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background-color: #020205;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .score-container {
            background: var(--glass);
            padding: 20px 40px;
            border-left: 4px solid var(--neon-blue);
            backdrop-filter: blur(10px);
        }

        .score-label { font-size: 14px; letter-spacing: 4px; color: var(--neon-blue); text-transform: uppercase; }
        .score-value { font-family: 'Orbitron', sans-serif; font-size: 42px; font-weight: 900; }

        #main-canvas {
            filter: contrast(1.2) brightness(1.1);
            box-shadow: 0 0 100px rgba(0,0,0,1);
        }

        /* MENU OVERLAY */
        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10,10,20,0.8) 0%, rgba(2,2,5,1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: all;
            backdrop-filter: blur(15px);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-card {
            text-align: center;
            padding: 60px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, var(--neon-blue) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0,242,255,0.5));
            letter-spacing: -2px;
        }

        .btn-premium {
            margin-top: 40px;
            padding: 20px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            background: transparent;
            color: white;
            border: 1px solid var(--neon-blue);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .btn-premium:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 40px var(--neon-blue);
            transform: scale(1.05);
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-container">
                <div class="score-label">System Neuralny</div>
                <div class="score-value" id="score">0000</div>
            </div>
            <div style="text-align: right">
                <div class="score-label" style="color: var(--neon-pink)">Status</div>
                <div class="score-value" style="font-size: 24px" id="status">ACTIVE</div>
            </div>
        </div>
    </div>

    <div id="menu" class="overlay">
        <div class="menu-card">
            <h1>SNAKE X</h1>
            <p style="letter-spacing: 10px; color: #666; margin-top: -10px;">NEURAL INTERFACE v2.0</p>
            <button class="btn-premium" onclick="core.init()">Initialize</button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <div class="menu-card">
            <h2 style="font-family: 'Orbitron'; font-size: 50px; color: var(--neon-pink)">CRITICAL ERROR</h2>
            <p id="final-score" style="font-size: 24px; color: #fff;"></p>
            <button class="btn-premium" onclick="core.init()">Reboot System</button>
        </div>
    </div>

    <canvas id="main-canvas"></canvas>

<script>
/**
 * SNAKE X-TREME ENGINE
 * Profesjonalny silnik renderujący bazujący na Canvas API
 */
const core = {
    canvas: document.getElementById('main-canvas'),
    ctx: null,
    grid: 25,
    size: 30,
    snake: [],
    food: {},
    dir: { x: 1, y: 0 },
    nextDir: { x: 1, y: 0 },
    score: 0,
    particles: [],
    frame: 0,
    isActive: false,

    init() {
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = 800;
        this.canvas.height = 800;
        this.snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
        this.dir = {x: 1, y: 0};
        this.nextDir = {x: 1, y: 0};
        this.score = 0;
        this.isActive = true;
        this.spawnFood();
        
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        document.getElementById('status').innerText = "ONLINE";
        document.getElementById('status').style.color = "var(--neon-blue)";
        
        this.loop();
    },

    spawnFood() {
        this.food = {
            x: Math.floor(Math.random() * (this.canvas.width/this.grid)),
            y: Math.floor(Math.random() * (this.canvas.height/this.grid)),
            hue: Math.random() * 360
        };
    },

    update() {
        this.dir = this.nextDir;
        const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };

        // Wall Collision
        if (head.x < 0 || head.x >= this.canvas.width/this.grid || head.y < 0 || head.y >= this.canvas.height/this.grid) return this.die();
        
        // Self Collision
        if (this.snake.some(s => s.x === head.x && s.y === head.y)) return this.die();

        this.snake.unshift(head);

        if (head.x === this.food.x && head.y === this.food.y) {
            this.score += 125;
            this.createExplosion(this.food.x * this.grid, this.food.y * this.grid, '#00f2ff');
            this.spawnFood();
            document.getElementById('score').innerText = this.score.toString().padStart(4, '0');
        } else {
            this.snake.pop();
        }
    },

    die() {
        this.isActive = false;
        document.getElementById('status').innerText = "FAILED";
        document.getElementById('status').style.color = "var(--neon-pink)";
        document.getElementById('final-score').innerText = `Wynik końcowy: ${this.score}`;
        document.getElementById('game-over').classList.remove('hidden');
        this.createExplosion(this.snake[0].x * this.grid, this.snake[0].y * this.grid, '#ff0055', 40);
    },

    createExplosion(x, y, color, count = 20) {
        for(let i=0; i<count; i++) {
            this.particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 0.5) * 15,
                alpha: 1,
                color: color
            });
        }
    },

    draw() {
        const ctx = this.ctx;
        this.frame++;

        // 1. Podkład / Background z efektem głębi
        ctx.fillStyle = '#020205';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // 2. Cyber-Siatka
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
        ctx.lineWidth = 1;
        for(let i=0; i<=this.canvas.width; i+=this.grid) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, this.canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(this.canvas.width, i); ctx.stroke();
        }

        // 3. Renderowanie Jedzenia (Animowane)
        const foodPulse = Math.sin(this.frame * 0.1) * 5;
        const fx = this.food.x * this.grid + this.grid/2;
        const fy = this.food.y * this.grid + this.grid/2;
        
        ctx.shadowBlur = 20 + foodPulse;
        ctx.shadowColor = `hsl(${this.food.hue}, 100%, 50%)`;
        ctx.fillStyle = `hsl(${this.food.hue}, 100%, 50%)`;
        ctx.beginPath();
        ctx.arc(fx, fy, (this.grid/3) + foodPulse/2, 0, Math.PI*2);
        ctx.fill();

        // 4. Renderowanie Węża (System Segmentowy)
        this.snake.forEach((s, i) => {
            const ratio = i / this.snake.length;
            ctx.shadowBlur = i === 0 ? 30 : 0;
            ctx.shadowColor = 'var(--neon-blue)';
            
            // Kolor gradientowy wzdłuż ciała
            ctx.fillStyle = i === 0 ? '#fff' : `hsl(${200 + ratio * 100}, 100%, ${50 - ratio * 20}%)`;
            
            const sizeMod = Math.cos(ratio * Math.PI) * 2; // Zwężający się ogon
            const padding = 2 + (i * 0.5);
            
            this.roundRect(
                s.x * this.grid + padding, 
                s.y * this.grid + padding, 
                this.grid - padding*2, 
                this.grid - padding*2, 
                8 - (ratio * 6)
            );
        });

        // 5. System Cząsteczek
        this.particles.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.02;
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 5;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 4, 4);
            if(p.alpha <= 0) this.particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    },

    roundRect(x, y, w, h, r) {
        this.ctx.beginPath();
        this.ctx.roundRect(x, y, w, h, r);
        this.ctx.fill();
    },

    loop() {
        if(!this.isActive) return;
        this.update();
        this.draw();
        // Dynamiczna prędkość
        setTimeout(() => requestAnimationFrame(() => this.loop()), 60);
    }
};

window.addEventListener('keydown', e => {
    const keys = { 37: {x:-1, y:0}, 38: {x:0, y:-1}, 39: {x:1, y:0}, 40: {x:0, y:1} };
    if(keys[e.keyCode]) {
        const move = keys[e.keyCode];
        // Blokada nawrotu o 180 stopni
        if(move.x !== -core.dir.x && move.y !== -core.dir.y) {
            core.nextDir = move;
        }
    }
});
</script>
</body>
</html>
